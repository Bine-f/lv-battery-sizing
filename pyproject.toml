[project]
name = "lv-battery-sizing"
version = "0.1.0"
description = "Data-driven sizing and placement of batteries that fix undervoltages in LV distribution feeders"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bine Flajnik" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "networkx>=3.0",
    "pandapower>=2.14",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
